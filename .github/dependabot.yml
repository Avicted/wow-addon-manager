# Keeps every pin current. The prefixes keep Dependabot's commit subjects
# in the Conventional Commits style.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
  # Dockerfile, Dockerfile.gui and Dockerfile.pre-commit, all pinned by digest.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: build
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: build
  - package-ecosystem: cargo
    directory: /gui
    schedule:
      interval: monthly
    commit-message:
      prefix: build
