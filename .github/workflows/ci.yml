name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Jobs prefer the self-hosted runner on the maintainer's PC (labels self-hosted, linux).
# GitHub cannot fall back by itself when that runner is offline: set the repository variable
# CI_RUNNER to "ubuntu-latest" (Settings > Secrets and variables > Actions > Variables) to use
# GitHub's hosted runners instead, and delete it to go back.
#
# CI runs the same make target a developer runs locally; the runner only needs
# Docker and make. `make check` is everything: Go and GUI tests, the smoke test,
# the Linux and Windows builds, the pre-commit hooks and the release check.
jobs:
  check:
    name: make check
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '["self-hosted", "linux"]') }}
    # Compiling eframe for Linux and Windows takes a while without a warm cache.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: make check

  commits:
    name: Conventional commits
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '["self-hosted", "linux"]') }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # A push can carry many commits, so check from the previous tip. `before`
      # is all zeros for a new branch and may be unreachable after a force push.
      - name: Validate commit subjects in this range
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "pull_request" ]; then
            range="$BASE..HEAD"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
              && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            range="$BEFORE..HEAD"
          else
            range="HEAD"
          fi
          echo "Checking $range"
          git log --format='%h %s' "$range" \
            | docker run --rm -i ghcr.io/avicted/conventional-commits:v1.1.0@sha256:aa84170cf7a56d5c2fa322c70ae7462e11ef0ef6eb9a740afb29887b1183d485
          # Every VERSION change must be a `make release` commit.
          make version-check RANGE="$range"

  # Publishes the Go test coverage as a shields.io endpoint file on the `badges` branch, which
  # the README badge reads. Only master pushes run it, after the checks passed. The branch is
  # one orphan commit, replaced each time, so it never grows. A push made with GITHUB_TOKEN
  # does not start another workflow run.
  coverage:
    name: Coverage badge
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: check
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '["self-hosted", "linux"]') }}
    timeout-minutes: 15
    permissions:
      contents: write # push the badges branch
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: make cover
      - name: Publish the badge
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          out=$(mktemp -d)
          scripts/coverage-badge.sh build/coverage/coverage.txt > "$out/coverage.json"
          cat "$out/coverage.json"
          cd "$out"
          git init -q -b badges
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add coverage.json
          git commit -q -m "chore(badges): coverage"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${REPO}.git" badges
