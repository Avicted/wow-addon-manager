name: Release

# Pushing a tag vX.Y.Z builds the binaries and publishes a GitHub Release.
# The tag must match VERSION and CHANGELOG.md must have an entry for it.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    name: Build and publish
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '["self-hosted", "linux"]') }}
    timeout-minutes: 45
    permissions:
      contents: write # create the release and upload its assets
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: make release-check TAG="$GITHUB_REF_NAME"
      - run: make test
      - run: make release-assets
      - run: make -s release-notes > build/release-notes.md
      # The action runs on the runner's own Node, so the self-hosted runner needs no gh CLI.
      - name: Publish
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          name: ${{ github.ref_name }}
          body_path: build/release-notes.md
          files: build/release/*
          fail_on_unmatched_files: true
          make_latest: true
