name: Release

# Pushing a tag vX.Y.Z builds the binaries and publishes a GitHub Release.
# The tag must match VERSION and CHANGELOG.md must have an entry for it.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write # create the release and upload its assets
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: make release-check TAG="$GITHUB_REF_NAME"
      - run: make test
      - run: make release-assets
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          make -s release-notes > build/release-notes.md
          gh release create "$GITHUB_REF_NAME" build/release/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes-file build/release-notes.md
