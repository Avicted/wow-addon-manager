[package]
name = "wam-gui"
version = "0.0.0" # the release version is ../VERSION, passed in by build.rs
edition = "2024"
license = "MIT"
publish = false
description = "Desktop app for wam, the WoW Forever addon manager"

[[bin]]
name = "wam-gui"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.37", default-features = false, features = [
    "accesskit", "clipboard", "default_fonts", "glow", "links", "persistence", "wayland", "x11",
] }
egui_extras = { version = "0.37", features = ["svg"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = { version = "0.18", default-features = false, features = ["xdg-portal", "wayland"] }
open = "5"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

# Windows renders with wgpu (DirectX 12 or Vulkan): eframe's OpenGL backend panics at startup
# when the driver offers no suitable pixel format (Wine, remote desktop, some VMs).
[target.'cfg(windows)'.dependencies]
eframe = { version = "0.37", default-features = false, features = ["wgpu"] }

[dev-dependencies]
# Renders the real UI headlessly (wgpu) and clicks it through accessibility labels.
egui_kittest = { version = "0.37", features = ["wgpu", "snapshot"] }

[profile.release]
lto = "thin"
strip = true
codegen-units = 4

[build-dependencies]
winresource = "0.1.34"
